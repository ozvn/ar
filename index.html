<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui">
  <title>LiveCanvas - Basic</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Enforce fixed rotation continuously to self-heal tracking flips.
    AFRAME.registerComponent("pose-guardian", {
      schema: {
        x: { type: "number", default: 0 },
        y: { type: "number", default: 0 },
        z: { type: "number", default: 0 },
        toleranceDeg: { type: "number", default: 0.05 }
      },
      init: function () {
        this.targetQuat = new THREE.Quaternion().setFromEuler(
          new THREE.Euler(
            THREE.MathUtils.degToRad(this.data.x),
            THREE.MathUtils.degToRad(this.data.y),
            THREE.MathUtils.degToRad(this.data.z),
            "XYZ"
          )
        );
      },
      enforce: function () {
        const current = this.el.object3D.quaternion;
        const angle = current.angleTo(this.targetQuat);
        const tolerance = THREE.MathUtils.degToRad(this.data.toleranceDeg);
        if (angle > tolerance) {
          current.copy(this.targetQuat);
          this.el.object3D.rotation.set(
            THREE.MathUtils.degToRad(this.data.x),
            THREE.MathUtils.degToRad(this.data.y),
            THREE.MathUtils.degToRad(this.data.z)
          );
        }
      },
      tick: function () {
        this.enforce();
      },
      tock: function () {
        this.enforce();
      }
    });

    // Keep model center aligned to image target center.
    AFRAME.registerComponent("auto-center", {
      schema: {
        offsetX: { type: "number", default: 0 },
        offsetY: { type: "number", default: 0 },
        offsetZ: { type: "number", default: 0 },
        rotX: { type: "number", default: 0 },
        rotY: { type: "number", default: 0 },
        rotZ: { type: "number", default: 0 },
        rotToleranceDeg: { type: "number", default: 0.1 },
        checkEveryMs: { type: "number", default: 250 }
      },
      init: function () {
        this.box = new THREE.Box3();
        this.center = new THREE.Vector3();
        this.localBox = new THREE.Box3();
        this.invRootMatrix = new THREE.Matrix4();
        this.localMatrix = new THREE.Matrix4();
        this.nextCheck = 0;
        this.onModelReady = this.onModelReady.bind(this);
        this.targetQuat = new THREE.Quaternion().setFromEuler(
          new THREE.Euler(
            THREE.MathUtils.degToRad(this.data.rotX),
            THREE.MathUtils.degToRad(this.data.rotY),
            THREE.MathUtils.degToRad(this.data.rotZ),
            "XYZ"
          )
        );
        this.el.addEventListener("model-loaded", this.onModelReady);
      },
      remove: function () {
        this.el.removeEventListener("model-loaded", this.onModelReady);
      },
      onModelReady: function () {
        this.alignToCenter();
        this.enforceRotation();
      },
      getLocalBounds: function (mesh) {
        mesh.updateMatrixWorld(true);
        this.invRootMatrix.copy(mesh.matrixWorld).invert();

        let found = false;
        this.box.makeEmpty();
        mesh.traverse((node) => {
          if (!node.isMesh || !node.geometry) return;

          if (!node.geometry.boundingBox) {
            node.geometry.computeBoundingBox();
          }
          if (!node.geometry.boundingBox) return;

          this.localBox.copy(node.geometry.boundingBox);
          this.localMatrix.multiplyMatrices(this.invRootMatrix, node.matrixWorld);
          this.localBox.applyMatrix4(this.localMatrix);
          this.box.union(this.localBox);
          found = true;
        });

        return found ? this.box : null;
      },
      alignToCenter: function () {
        const mesh = this.el.getObject3D("mesh");
        if (!mesh) return;

        const bounds = this.getLocalBounds(mesh);
        if (!bounds || bounds.isEmpty()) return;

        bounds.getCenter(this.center);
        this.el.object3D.position.set(
          this.data.offsetX - this.center.x,
          this.data.offsetY - this.center.y,
          this.data.offsetZ - this.center.z
        );
      },
      enforceRotation: function () {
        const tolerance = THREE.MathUtils.degToRad(this.data.rotToleranceDeg);
        const current = this.el.object3D.quaternion;
        if (current.angleTo(this.targetQuat) <= tolerance) return;

        current.copy(this.targetQuat);
        this.el.object3D.rotation.set(
          THREE.MathUtils.degToRad(this.data.rotX),
          THREE.MathUtils.degToRad(this.data.rotY),
          THREE.MathUtils.degToRad(this.data.rotZ)
        );
      },
      tick: function (time) {
        if (time < this.nextCheck) return;
        this.nextCheck = time + this.data.checkEveryMs;
        this.alignToCenter();
        this.enforceRotation();
      }
    });
  </script>
  <script defer="defer" src="./app.js"></script>
</head>
<body>
  <div id="status">Kamera baslatiliyor...</div>
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; autoStart: true; warmupTolerance: 20; missTolerance: 18; filterMinCF: 0.001; filterBeta: 0.001"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets timeout="12000">
      <a-asset-item id="modelMain" src="./anafartalarkomutaniebedibaskumandangazimaraselbasbugmustafakemalataturk3d.glb"></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false; touchEnabled: false; reverseMouseDrag: false"
      wasd-controls="enabled: false"
    ></a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0"
      pose-guardian="x: 0; y: 0; z: 0"
      marker-smooth="preset: stable; posLerp: 0.1; slowRotLerp: 0.12; fastRotLerp: 0.35; fastRotThresholdDeg: 3; rotDeadzoneDeg: 1.1; scaleLerp: 0.1"
    >
      <a-gltf-model
        src="#modelMain"
        position="0 0 0"
        rotation="0 0 0"
        scale="1.44 1.44 1.44"
        auto-center="offsetX: 0; offsetY: 0; offsetZ: 0; rotX: 0; rotY: 0; rotZ: 0; rotToleranceDeg: 0.1; checkEveryMs: 250"
        animation-mixer="clip: *; loop: repeat; repetitions: Infinity"
      ></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
