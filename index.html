<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui">
  <title>LiveCanvas - Basic</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Keep tracked target rotation fixed to prevent camera-facing flips.
    AFRAME.registerComponent("lock-rotation", {
      schema: {
        x: { type: "number", default: 0 },
        y: { type: "number", default: 0 },
        z: { type: "number", default: 0 }
      },
      tick: function () {
        this.el.object3D.rotation.set(
          THREE.MathUtils.degToRad(this.data.x),
          THREE.MathUtils.degToRad(this.data.y),
          THREE.MathUtils.degToRad(this.data.z)
        );
      }
    });
  </script>
  <script defer="defer" src="./app.js"></script>
</head>
<body>
  <div id="status">Kamera baslatiliyor...</div>
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; autoStart: true; warmupTolerance: 20; missTolerance: 18; filterMinCF: 0.001; filterBeta: 0.001"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets timeout="12000">
      <a-asset-item id="modelMain" src="./anafartalarkomutaniebedibaskumandangazimaraselbasbugmustafakemalataturk3d.glb"></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false; touchEnabled: false; reverseMouseDrag: false"
      wasd-controls="enabled: false"
    ></a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0"
      lock-rotation="x: 0; y: 0; z: 0"
      marker-smooth="preset: stable; posLerp: 0.1; slowRotLerp: 0.12; fastRotLerp: 0.35; fastRotThresholdDeg: 3; rotDeadzoneDeg: 1.1; scaleLerp: 0.1"
    >
      <a-gltf-model
        src="#modelMain"
        position="0 -0.16 0"
        rotation="0 0 0"
        scale="1.44 1.44 1.44"
        animation-mixer="clip: *; loop: repeat; repetitions: Infinity"
      ></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
